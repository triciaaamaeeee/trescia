<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Name · Information Technology Portfolio</title>
    <meta name="description" content="Portfolio of a fourth-year Information Technology student interested in technology, problem-solving, data management, and software development.">
    <meta name="author" content="Your Name">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#08090f">
    <meta property="og:title" content="Your Name · Information Technology Portfolio">
    <meta property="og:description" content="Portfolio of a fourth-year Information Technology student interested in technology, problem-solving, data management, and software development.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grid-fade"></div>
    </div>

    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="#hero">
          <span class="brand-mark" id="brand-mark" aria-hidden="true">YN</span>
          <span id="brand-name">Your Name</span>
        </a>
        <div id="nav-menu" class="nav-links">
          <ul class="nav-list">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#achievements">Achievements</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>
        <div class="nav-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light mode">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 3v1.5M12 19.5V21M4.9 4.9l1.1 1.1M18 18l1.1 1.1M3 12h1.5M19.5 12H21M4.9 19.1 6 18M18 6l1.1-1.1"></path>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 14.5A7.5 7.5 0 1 1 9.5 4 6 6 0 0 0 20 14.5z"></path>
            </svg>
          </button>
          <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
            <span class="sr-only">Open menu</span>
            <svg class="icon icon-open" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
            <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <noscript>
        <div class="container noscript-note">
          <p>This portfolio builds its sections from <code>js/data.js</code>. Enable JavaScript to view the page.</p>
        </div>
      </noscript>
      <section id="hero" aria-labelledby="hero-heading"></section>
      <section id="about" class="band" aria-labelledby="about-heading"></section>
      <section id="skills" class="band" aria-labelledby="skills-heading"></section>
      <section id="projects" class="band" aria-labelledby="projects-heading"></section>
      <section id="education" class="band" aria-labelledby="education-heading"></section>
      <section id="experience" class="band" aria-labelledby="experience-heading"></section>
      <section id="achievements" class="band" aria-labelledby="achievements-heading"></section>
      <section id="contact" class="band" aria-labelledby="contact-heading"></section>
    </main>

    <footer class="site-footer" id="footer"></footer>
    <a class="to-top" href="#hero" aria-label="Back to top" aria-hidden="true" tabindex="-1">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V6"></path>
        <path d="m7 10 5-5 5 5"></path>
      </svg>
    </a>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</html>
