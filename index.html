<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Hackers!</title>

<style>
body{
  margin:0;
  font-family:Tahoma, sans-serif;
  font-style:italic;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background-image:url("image3.jpg");
  background-size:cover;
  background-position:center;
}

body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  z-index:-1;
}

/* CARD */
.card{
  width:90%;
  max-width:900px;
  height:500px;
  background:transparent;
  border-radius:30px;
  display:flex;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* LEFT */
.left{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  color:white;
}

.left h1{
  font-size:20px;
  margin:0;
}

.left p{
  font-size:14px;
  padding:10px;
}

/* RIGHT */
.right{
  flex:1;
  display:flex;
}

.right-img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:0;
  z-index:9999;
}
</style>
</head>

<body>

<div class="card">

  <div class="left">
    <h1>HAPPIEST BIRTHDAY MJ AND JAY ANDREW!!! 🎉</h1>

    <p>
      PADAYON MGA FUTURE PROGRAMMERS! 🎂🎈💻
    </p>

    <audio id="song" controls autoplay loop>
    <source src="music.mp4" type="audio/mp4">
</audio>
  </div>

  <div class="right">
    <img src="mj-jay.jpg" class="right-img" alt="Birthday Image">
  </div>

</div>

<script>
let confettiRunning = false;

function celebrate() {
  const song = document.getElementById("song");

  song.play().catch(() => {
    console.log("Autoplay blocked by browser.");
  });

  if(confettiRunning) return;
  confettiRunning = true;

  const colors = [
    "#ff4d6d",
    "#3b82f6",
    "#facc15",
    "#22c55e",
    "#a855f7",
    "#ff9f1c",
    "#00f5d4"
  ];

  setInterval(() => {
    for(let i = 0; i < 8; i++) {

      let c = document.createElement("div");
      c.className = "confetti";

      c.style.left = Math.random() * 100 + "vw";
      c.style.top = "-10px";

      let size = Math.random() * 8 + 4;
      c.style.width = size + "px";
      c.style.height = size + "px";

      c.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      document.body.appendChild(c);

      let xMove = (Math.random() - 0.5) * 250;
      let duration = Math.random() * 2 + 2;

      c.animate([
        {
          transform: "translate(0,0) rotate(0deg)",
          opacity: 1
        },
        {
          transform: `translate(${xMove}px,100vh) rotate(720deg)`,
          opacity: 0
        }
      ], {
        duration: duration * 1000,
        easing: "linear"
      });

      setTimeout(() => c.remove(), duration * 1000);
    }
  }, 120);
}

window.onload = celebrate;
</script>

</body>
</html>
